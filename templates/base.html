<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Forest Stay{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="/"> Forest<span>Stay</span></a>
  <nav>
    <a href="/houses">Домики</a>
    {% if user %}
      <a href="/profile">Мои брони</a>
      <a class="nav-user" href="/profile">{{ user.name }}</a>
      <a class="nav-login" href="/logout">Выйти</a>
    {% else %}
      <a href="/login">Войти</a>
      <a class="nav-login" href="/register">Регистрация</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="footer">
  <a class="logo" href="/"> Forest<span>Stay</span></a>
  <p>Место, где можно замедлиться.</p>
  <small>© 2026 Forest Stay · Учебный проект</small>
</footer>
</body>
</html>
